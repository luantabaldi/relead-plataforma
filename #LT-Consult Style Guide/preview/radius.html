<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Radius</title></head><body>
<div class="card">
  <div style="display:flex; gap:16px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:4px;"></div><div style="font-size:11px; font-weight:600;">sm</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">4px</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:8px;"></div><div style="font-size:11px; font-weight:600;">md · base</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">8px</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:12px;"></div><div style="font-size:11px; font-weight:600;">lg</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">12px</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:16px;"></div><div style="font-size:11px; font-weight:600;">xl</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">16px</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:24px;"></div><div style="font-size:11px; font-weight:600;">2xl</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">24px</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:64px; height:64px; background:#EFF4FF; border:1px solid #2563EB22; border-radius:999px;"></div><div style="font-size:11px; font-weight:600;">full</div><div style="font-size:10px; color:var(--fg3); font-family:var(--font-mono);">999px</div></div>
  </div>
</div>
</body></html>
