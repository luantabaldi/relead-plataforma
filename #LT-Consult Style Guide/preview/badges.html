<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Badges</title></head><body>
<div class="card">
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#F3F4F6; color:#374151; border:1px solid #E5E7EB;">Default</span>
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#EFF4FF; color:#1D4ED8; border:1px solid #2563EB22;">Brand</span>
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#DCFCE7; color:#166534;">Active</span>
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#FEF3C7; color:#92400E;">Pending</span>
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#FEE2E2; color:#991B1B;">Blocked</span>
    <span style="font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#0A0A0A; color:#fff;">New</span>
  </div>
  <div style="display:flex; gap:8px;">
    <span style="font-size:11px; font-weight:600; letter-spacing:0.06em; padding:3px 8px; border-radius:4px; background:#fff; color:#0A0A0A; border:1px solid #E5E7EB;">v2.4</span>
    <span style="font-size:11px; font-weight:600; letter-spacing:0.06em; padding:3px 8px; border-radius:4px; background:#0A0A0A; color:#fff;">BETA</span>
    <span style="display:inline-flex; gap:6px; align-items:center; font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; background:#DCFCE7; color:#166534;"><span style="width:6px; height:6px; border-radius:50%; background:#16A34A;"></span>Online</span>
  </div>
</div>
</body></html>
