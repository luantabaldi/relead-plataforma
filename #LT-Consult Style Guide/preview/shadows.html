<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Shadows</title></head><body>
<div class="card" style="background:#F5F5F5;">
  <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:16px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:88px; height:88px; background:#fff; border-radius:8px; box-shadow:0 1px 2px rgba(10,10,10,0.04);"></div><div style="font-size:11px; font-weight:600;">xs</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:88px; height:88px; background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(10,10,10,0.06), 0 1px 2px rgba(10,10,10,0.04);"></div><div style="font-size:11px; font-weight:600;">sm</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:88px; height:88px; background:#fff; border-radius:8px; box-shadow:0 4px 12px rgba(10,10,10,0.06), 0 2px 4px rgba(10,10,10,0.04);"></div><div style="font-size:11px; font-weight:600;">md</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:88px; height:88px; background:#fff; border-radius:8px; box-shadow:0 12px 32px rgba(10,10,10,0.10), 0 4px 8px rgba(10,10,10,0.04);"></div><div style="font-size:11px; font-weight:600;">lg</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;"><div style="width:88px; height:88px; background:#fff; border-radius:8px; box-shadow:0 24px 48px rgba(10,10,10,0.14);"></div><div style="font-size:11px; font-weight:600;">xl</div></div>
  </div>
</div>
</body></html>
