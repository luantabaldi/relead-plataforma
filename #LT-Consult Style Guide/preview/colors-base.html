<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Base & surface</title></head><body>
<div class="card">
  <div class="row" style="gap:0; border-radius:8px; overflow:hidden; border:1px solid var(--border);">
    <div style="flex:1; height:100px; background:#F5F5F5; display:flex; align-items:flex-end; padding:10px;"><span style="font-size:11px; color:var(--fg3);">--bg · #F5F5F5</span></div>
    <div style="flex:1; height:100px; background:#FFFFFF; display:flex; align-items:flex-end; padding:10px; border-left:1px solid var(--border);"><span style="font-size:11px; color:var(--fg3);">--bg-elev · #FFFFFF</span></div>
    <div style="flex:1; height:100px; background:#2A39FF; display:flex; align-items:flex-end; padding:10px;"><span style="font-size:11px; color:#FFFFFF;">--brand · #2A39FF</span></div>
    <div style="flex:1; height:100px; background:#0A0A0A; display:flex; align-items:flex-end; padding:10px;"><span style="font-size:11px; color:#9CA3AF;">--fg1 · #0A0A0A</span></div>
    <div style="flex:1; height:100px; background:#374151; display:flex; align-items:flex-end; padding:10px;"><span style="font-size:11px; color:#D1D5DB;">--fg2 · #374151</span></div>
    <div style="flex:1; height:100px; background:#6B7280; display:flex; align-items:flex-end; padding:10px;"><span style="font-size:11px; color:#F3F4F6;">--fg3 · #6B7280</span></div>
  </div>
</div>
</body></html>
