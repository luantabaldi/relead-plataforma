<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Cards</title></head><body>
<div class="card" style="background:#F5F5F5;">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
    <div style="background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:20px;">
      <div style="font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#6B7280;">SERVICE</div>
      <div style="font-size:20px; font-weight:600; line-height:1.25; color:#0A0A0A; margin-top:8px;">Growth strategy</div>
      <div style="font-size:13px; line-height:1.55; color:#374151; margin-top:6px;">Quantified growth modeling, shipped in 12 weeks.</div>
    </div>
    <div style="background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:20px; box-shadow:0 4px 12px rgba(10,10,10,0.06), 0 2px 4px rgba(10,10,10,0.04);">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;"><div style="font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#2563EB;">CASE</div><span style="font-size:10px; padding:2px 8px; border-radius:999px; background:#DCFCE7; color:#166534;">Live</span></div>
      <div style="font-size:20px; font-weight:600; line-height:1.25; color:#0A0A0A; margin-top:8px;">Northwind · −41% cycle time</div>
      <div style="font-size:13px; line-height:1.55; color:#374151; margin-top:6px;">Rebuilt the funnel and qualification model end to end.</div>
    </div>
  </div>
</div>
</body></html>
