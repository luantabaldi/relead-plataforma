<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Brand color</title></head><body>
<div class="card">
  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; gap:0; border-radius:8px; overflow:hidden; border:1px solid var(--border);">
      <div style="flex:1; height:96px; background:#E8EAFF; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#1A26D9; font-weight:600;">soft</span><span style="font-size:10px; color:#4B5563; font-family:var(--font-mono);">#E8EAFF</span></div>
      <div style="flex:1; height:96px; background:#8E97FF; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#0A0A0A; font-weight:600;">300</span><span style="font-size:10px; color:#1F2937; font-family:var(--font-mono);">#8E97FF</span></div>
      <div style="flex:1; height:96px; background:#2A39FF; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">brand · Azul LT</span><span style="font-size:10px; color:#D6D9FF; font-family:var(--font-mono);">#2A39FF</span></div>
      <div style="flex:1; height:96px; background:#1A26D9; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">700 · pressed</span><span style="font-size:10px; color:#C7CBFF; font-family:var(--font-mono);">#1A26D9</span></div>
    </div>
    <div style="display:flex; gap:0; border-radius:8px; overflow:hidden; border:1px solid var(--border);">
      <div style="flex:1; height:80px; background:#FFFFFF; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#0A0A0A; font-weight:600;">white</span><span style="font-size:10px; color:#6B7280; font-family:var(--font-mono);">#FFFFFF</span></div>
      <div style="flex:1; height:80px; background:#F5F5F5; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#0A0A0A; font-weight:600;">off-white</span><span style="font-size:10px; color:#6B7280; font-family:var(--font-mono);">#F5F5F5</span></div>
      <div style="flex:1; height:80px; background:#E5E7EB; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#0A0A0A; font-weight:600;">gray-200</span><span style="font-size:10px; color:#6B7280; font-family:var(--font-mono);">#E5E7EB</span></div>
      <div style="flex:1; height:80px; background:#9CA3AF; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">gray-400</span><span style="font-size:10px; color:#F3F4F6; font-family:var(--font-mono);">#9CA3AF</span></div>
      <div style="flex:1; height:80px; background:#374151; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">gray-700</span><span style="font-size:10px; color:#D1D5DB; font-family:var(--font-mono);">#374151</span></div>
      <div style="flex:1; height:80px; background:#111111; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">near-black</span><span style="font-size:10px; color:#9CA3AF; font-family:var(--font-mono);">#111111</span></div>
      <div style="flex:1; height:80px; background:#0A0A0A; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;"><span style="font-size:11px; color:#fff; font-weight:600;">black</span><span style="font-size:10px; color:#9CA3AF; font-family:var(--font-mono);">#0A0A0A</span></div>
    </div>
  </div>
</div>
</body></html>
