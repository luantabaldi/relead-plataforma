<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Semantic colors</title></head><body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px;">
    <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
      <div style="height:60px; background:#16A34A;"></div>
      <div style="padding:10px; background:#DCFCE7;"><div style="font-size:11px; font-weight:600; color:#0A0A0A;">Success</div><div style="font-size:10px; color:#4B5563; font-family:var(--font-mono);">#16A34A</div></div>
    </div>
    <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
      <div style="height:60px; background:#D97706;"></div>
      <div style="padding:10px; background:#FEF3C7;"><div style="font-size:11px; font-weight:600; color:#0A0A0A;">Warning</div><div style="font-size:10px; color:#4B5563; font-family:var(--font-mono);">#D97706</div></div>
    </div>
    <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
      <div style="height:60px; background:#DC2626;"></div>
      <div style="padding:10px; background:#FEE2E2;"><div style="font-size:11px; font-weight:600; color:#0A0A0A;">Danger</div><div style="font-size:10px; color:#4B5563; font-family:var(--font-mono);">#DC2626</div></div>
    </div>
    <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
      <div style="height:60px; background:#0284C7;"></div>
      <div style="padding:10px; background:#E0F2FE;"><div style="font-size:11px; font-weight:600; color:#0A0A0A;">Info</div><div style="font-size:10px; color:#4B5563; font-family:var(--font-mono);">#0284C7</div></div>
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <span style="font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#DCFCE7; color:#166534;">Active</span>
    <span style="font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#FEF3C7; color:#92400E;">Pending</span>
    <span style="font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#FEE2E2; color:#991B1B;">Error</span>
    <span style="font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#E0F2FE; color:#075985;">Info</span>
  </div>
</div>
</body></html>
