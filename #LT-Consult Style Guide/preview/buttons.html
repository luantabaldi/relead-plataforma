<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Buttons</title></head><body>
<div class="card">
  <div style="display:flex; gap:8px; align-items:center;">
    <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:#2563EB; color:#fff; border:none; padding:10px 18px; border-radius:8px; cursor:pointer;">Get in touch</button>
    <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:#fff; color:#0A0A0A; border:1px solid #E5E7EB; padding:10px 18px; border-radius:8px; cursor:pointer;">Read more</button>
    <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:transparent; color:#0A0A0A; border:none; padding:10px 14px; border-radius:8px; cursor:pointer;">Cancel</button>
    <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:#0A0A0A; color:#fff; border:none; padding:10px 18px; border-radius:8px; cursor:pointer;">Book a call</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <button style="font-family:var(--font-sans); font-size:12px; font-weight:500; background:#2563EB; color:#fff; border:none; padding:6px 12px; border-radius:6px;">Small</button>
    <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:#2563EB; color:#fff; border:none; padding:10px 18px; border-radius:8px;">Default</button>
    <button style="font-family:var(--font-sans); font-size:16px; font-weight:500; background:#2563EB; color:#fff; border:none; padding:14px 22px; border-radius:8px;">Large</button>
    <button disabled style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:#E5E7EB; color:#9CA3AF; border:none; padding:10px 18px; border-radius:8px;">Disabled</button>
  </div>
</div>
</body></html>
