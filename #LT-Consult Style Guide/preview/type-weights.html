<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Type weights</title></head><body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
    <div style="padding:16px; border:1px solid var(--border); border-radius:8px;"><div style="font-family:var(--font-sans); font-size:24px; font-weight:400; letter-spacing:-0.01em;">Aa</div><div style="font-size:11px; color:var(--fg3); margin-top:4px; font-family:var(--font-mono);">Regular · 400</div></div>
    <div style="padding:16px; border:1px solid var(--border); border-radius:8px;"><div style="font-family:var(--font-sans); font-size:24px; font-weight:500; letter-spacing:-0.01em;">Aa</div><div style="font-size:11px; color:var(--fg3); margin-top:4px; font-family:var(--font-mono);">Medium · 500</div></div>
    <div style="padding:16px; border:1px solid var(--border); border-radius:8px;"><div style="font-family:var(--font-sans); font-size:24px; font-weight:600; letter-spacing:-0.01em;">Aa</div><div style="font-size:11px; color:var(--fg3); margin-top:4px; font-family:var(--font-mono);">Semibold · 600</div></div>
    <div style="padding:16px; border:1px solid var(--border); border-radius:8px;"><div style="font-family:var(--font-sans); font-size:24px; font-weight:700; letter-spacing:-0.01em;">Aa</div><div style="font-size:11px; color:var(--fg3); margin-top:4px; font-family:var(--font-mono);">Bold · 700</div></div>
  </div>
  <div style="font-size:11px; color:var(--fg3); font-family:var(--font-mono);">Geist · variable font · loaded locally from /fonts/</div>
</div>
</body></html>
