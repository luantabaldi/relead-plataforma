<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Logo</title></head><body>
<div class="card">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
    <div style="background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:24px; display:flex; align-items:center; justify-content:center; min-height:80px;">
      <img src="../assets/logo.svg" alt="LT Consult" style="height:36px;">
    </div>
    <div style="background:#0A0A0A; border-radius:8px; padding:24px; display:flex; align-items:center; justify-content:center; min-height:80px;">
      <img src="../assets/wordmark-dark.svg" alt="LT Consult" style="height:28px;">
    </div>
    <div style="background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:16px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/logo-mark.svg" alt="" style="height:48px;">
    </div>
    <div style="background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:16px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/wordmark.svg" alt="LT Consult" style="height:24px;">
    </div>
  </div>
</div>
</body></html>
