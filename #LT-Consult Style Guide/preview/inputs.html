<!DOCTYPE html>
<html><head><link rel="stylesheet" href="_card.css"><title>Inputs</title></head><body>
<div class="card">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:500; color:#374151;">Email</span>
      <input value="hello@ltconsult.com" style="font-family:var(--font-sans); font-size:14px; padding:9px 12px; border:1px solid #DCDCDC; border-radius:8px; background:#fff; color:#0A0A0A; outline:none;">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:500; color:#374151;">Company <span style="color:#2563EB;">·</span></span>
      <input placeholder="Northwind GmbH" style="font-family:var(--font-sans); font-size:14px; padding:9px 12px; border:2px solid #2563EB; border-radius:8px; background:#fff; color:#0A0A0A; outline:none; box-shadow:0 0 0 3px rgba(37,99,235,0.20);">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:500; color:#374151;">Industry</span>
      <select style="font-family:var(--font-sans); font-size:14px; padding:9px 12px; border:1px solid #DCDCDC; border-radius:8px; background:#fff; color:#0A0A0A;"><option>Software · B2B SaaS</option></select>
    </label>
    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:12px; font-weight:500; color:#DC2626;">Phone</span>
      <input value="+49 30 11 22" style="font-family:var(--font-sans); font-size:14px; padding:9px 12px; border:1px solid #DC2626; border-radius:8px; background:#fff; color:#0A0A0A;">
      <span style="font-size:11px; color:#DC2626;">Invalid format.</span>
    </label>
  </div>
</div>
</body></html>
