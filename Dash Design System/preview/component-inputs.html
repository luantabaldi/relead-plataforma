<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .lab { font: 700 10px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); }
  .inp { font: 400 13px/1 var(--font-mono); letter-spacing: -0.02em; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--paper-300); background: var(--paper-0); color: var(--ink-200); transition: all 160ms; outline: none; width: 100%; box-sizing: border-box; }
  .inp.focus { border-color: var(--orange-600); box-shadow: 0 0 0 3px rgba(23, 30, 69, 0.18); }
  .inp.err { border-color: var(--red-500); box-shadow: 0 0 0 3px rgba(199, 52, 40, 0.15); }
  .help { font: 400 11px/1.3 var(--font-mono); color: var(--ink-50); letter-spacing: -0.02em; }
  .help.err { color: var(--red-500); }
  .search { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 999px; background: var(--paper-100); border: 1px solid transparent; }
  .search input { background: transparent; border: 0; outline: 0; font: 400 13px/1 var(--font-mono); letter-spacing: -0.02em; color: var(--ink-200); flex: 1; }
  .search svg { color: var(--ink-50); }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 4px; }
  .label-card { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
</style></head>
<body>
<div class="card">
  <div class="label-card">Components · 09</div>
  <div class="title">Inputs & search</div>
  <div class="grid" style="margin-top: 16px;">
    <div class="row">
      <div class="lab">Default</div>
      <input class="inp" value="Sajibur Rahman">
    </div>
    <div class="row">
      <div class="lab">Focused</div>
      <input class="inp focus" value="$2,500.00">
    </div>
    <div class="row">
      <div class="lab">Error</div>
      <input class="inp err" value="not-an-email">
      <div class="help err">Enter a valid email address.</div>
    </div>
    <div class="row">
      <div class="lab">Search</div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        <input placeholder="Search transactions…">
      </div>
    </div>
  </div>
</div>
</body></html>
