<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label-card { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat {
    background: var(--paper-0);
    border: 1px solid var(--paper-200);
    border-radius: 12px;
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat.accent { background: var(--orange-600); border-color: transparent; color: #FBF8F3; }
  .stat .eyebrow { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); display: flex; justify-content: space-between; align-items: center;}
  .stat.accent .eyebrow { color: rgba(251,248,243,0.72); }
  .stat .icon { width: 28px; height: 28px; border-radius: 50%; background: var(--paper-100); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-100); }
  .stat.accent .icon { background: rgba(255,255,255,0.18); color: #FBF8F3; }
  .stat .num { font-family: "Google Sans Flex Display", "Google Sans Flex", sans-serif; font-weight: 600; font-size: 32px; line-height: 1; letter-spacing: -0.025em; color: var(--ink-300); font-variant-numeric: tabular-nums; }
  .stat.accent .num { color: #FBF8F3; }
  .stat .delta { font-family: "Google Sans Flex", sans-serif; font-weight: 600; font-size: 11px; line-height: 1; letter-spacing: -0.01em; }
  .stat .delta .up { color: var(--green-500); }
  .stat.accent .delta .up { color: #C7F0D5; }
  .stat .delta .muted { color: var(--ink-50); }
  .stat.accent .delta .muted { color: rgba(251,248,243,0.72); }
</style></head>
<body>
<div class="card">
  <div class="label-card">Components · 10</div>
  <div class="title">Stat cards — neutral & accent</div>
  <div class="row">
    <div class="stat">
      <div class="eyebrow">Total balance
        <span class="icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
        </span>
      </div>
      <div class="num">$689,372.00</div>
      <div class="delta"><span class="up">↑ 5%</span> <span class="muted">than last month</span></div>
    </div>
    <div class="stat accent">
      <div class="eyebrow">Total earnings
        <span class="icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </span>
      </div>
      <div class="num">$950</div>
      <div class="delta"><span class="up">↑ 7%</span> <span class="muted">this month</span></div>
    </div>
  </div>
</div>
</body></html>
