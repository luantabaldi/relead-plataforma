<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .typeface-row { display: flex; align-items: flex-end; gap: 32px; padding: 8px 0 16px; }
  .glyph { font-family: var(--font-mono); font-weight: 700; font-size: 140px; line-height: 0.85; color: var(--ink-300); letter-spacing: -0.04em; }
  .glyph .accent { color: var(--orange-600); }
  .specimen { display: flex; flex-direction: column; gap: 6px; }
  .specimen .meta { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); }
  .specimen .name { font-family: var(--font-mono); font-weight: 700; font-size: 28px; line-height: 1; color: var(--ink-300); letter-spacing: -0.02em; }
  .weights { font-family: var(--font-mono); font-size: 14px; color: var(--ink-100); letter-spacing: -0.02em; }
  .weights span { padding-right: 14px; display: inline-block; }
  .weights .r { font-weight: 400; }
  .weights .b { font-weight: 700; }
  .weights .it { font-style: italic; color: var(--orange-700); }
</style></head>
<body>
<div class="card">
  <div class="typeface-row">
    <div class="glyph">M<span class="accent">m</span></div>
    <div class="specimen">
      <div class="meta">Labels · code · 02</div>
      <div class="name">Space Mono</div>
      <div class="weights">
        <span class="r">Regular</span>
        <span class="b">Bold</span>
        <span class="r it">Italic</span>
        <span class="b it">Bold Italic</span>
      </div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-50); letter-spacing: 0.04em; text-transform: uppercase; margin-top:8px;">Used for: Eyebrow labels · IDs · currency codes · code</div>
    </div>
  </div>
</div>
</body></html>
