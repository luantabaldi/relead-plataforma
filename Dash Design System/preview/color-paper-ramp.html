<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1 / 1.1; border-radius: 12px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: -0.02em; border: 1px solid var(--paper-200); }
  .sw .n { font-weight: 700; font-size: 12px; }
  .sw .h { opacity: 0.7; font-size: 10px; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .name { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 14px; }
</style></head>
<body>
<div class="card">
  <div class="label">Neutrals · 02</div>
  <div class="name">Gray — cool, crisp</div>
  <div class="ramp">
    <div class="sw" style="background:#FFFFFF; color:#2E2A23;"><div class="n">0</div><div class="h">FFFFFF</div></div>
    <div class="sw" style="background:#F7F8FA; color:#2E2A23;"><div class="n">50 ★</div><div class="h">F7F8FA</div></div>
    <div class="sw" style="background:#EEF0F4; color:#2E2A23;"><div class="n">100</div><div class="h">EEF0F4</div></div>
    <div class="sw" style="background:#E1E5EB; color:#2E2A23;"><div class="n">200</div><div class="h">E1E5EB</div></div>
    <div class="sw" style="background:#CBD1DA; color:#2E2A23; border-color: transparent;"><div class="n">300</div><div class="h">CBD1DA</div></div>
    <div class="sw" style="background:#98A0AD; color:#1A1611; border-color: transparent;"><div class="n">400</div><div class="h">98A0AD</div></div>
  </div>
  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-50); letter-spacing: -0.02em; margin-top: 14px;">★ 50 is the page background · 200 is the canonical hairline</div>
</div>
</body></html>
