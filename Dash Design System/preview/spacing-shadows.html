<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 8px 4px 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .shape { width: 90px; height: 60px; background: var(--paper-0); border-radius: 12px; border: 1px solid var(--paper-200); }
  .name { font: 700 11px/1 var(--font-mono); color: var(--ink-200); letter-spacing: -0.02em; text-align: center; }
  .desc { font: 400 10px/1.3 var(--font-mono); color: var(--ink-50); letter-spacing: -0.02em; text-align: center; max-width: 100px; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 6px; }
  .xs { box-shadow: 0 1px 2px rgba(64, 38, 14, 0.04); }
  .sm { box-shadow: 0 2px 6px rgba(64, 38, 14, 0.05), 0 1px 2px rgba(64, 38, 14, 0.04); }
  .md { box-shadow: 0 8px 24px rgba(64, 38, 14, 0.07), 0 2px 6px rgba(64, 38, 14, 0.05); }
  .lg { box-shadow: 0 24px 48px rgba(64, 38, 14, 0.10), 0 4px 12px rgba(64, 38, 14, 0.06); }
  .ac { box-shadow: 0 8px 24px rgba(23, 30, 69, 0.22); background: var(--orange-600); border-color: transparent; }
</style></head>
<body>
<div class="card">
  <div class="label">Tokens · 07</div>
  <div class="title">Shadows — brown-tinted, soft</div>
  <div class="grid">
    <div class="item"><div class="shape xs"></div><div class="name">xs</div><div class="desc">Input focus halo</div></div>
    <div class="item"><div class="shape sm"></div><div class="name">sm</div><div class="desc">Card hover lift</div></div>
    <div class="item"><div class="shape md"></div><div class="name">md</div><div class="desc">Menus, popovers</div></div>
    <div class="item"><div class="shape lg"></div><div class="name">lg</div><div class="desc">Modals, toasts</div></div>
    <div class="item"><div class="shape ac"></div><div class="name">accent</div><div class="desc">CTA hover only</div></div>
  </div>
</div>
</body></html>
