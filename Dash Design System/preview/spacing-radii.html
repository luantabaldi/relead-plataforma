<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 72px; height: 72px; background: var(--orange-600); border: 1px solid var(--orange-700); }
  .name { font: 700 11px/1 var(--font-mono); color: var(--ink-200); letter-spacing: -0.02em; }
  .px { font: 400 10px/1 var(--font-mono); color: var(--ink-50); letter-spacing: -0.02em; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 16px; }
</style></head>
<body>
<div class="card">
  <div class="label">Tokens · 06</div>
  <div class="title">Radii — soft at the edges</div>
  <div class="grid">
    <div class="item"><div class="shape" style="border-radius: 4px"></div><div class="name">xs</div><div class="px">4</div></div>
    <div class="item"><div class="shape" style="border-radius: 8px"></div><div class="name">sm</div><div class="px">8 · chips</div></div>
    <div class="item"><div class="shape" style="border-radius: 12px; outline: 2px solid var(--ink-300); outline-offset: 3px;"></div><div class="name">md ★</div><div class="px">12 · cards, inputs</div></div>
    <div class="item"><div class="shape" style="border-radius: 16px"></div><div class="name">lg</div><div class="px">16 · modals</div></div>
    <div class="item"><div class="shape" style="border-radius: 20px"></div><div class="name">xl</div><div class="px">20 · hero</div></div>
    <div class="item"><div class="shape" style="border-radius: 999px"></div><div class="name">full</div><div class="px">∞ · pills</div></div>
  </div>
</div>
</body></html>
