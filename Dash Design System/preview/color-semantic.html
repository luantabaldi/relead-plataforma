<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .item { padding: 18px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid; }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .item .meta { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .item .num { font-family: "Google Sans Flex Display", "Google Sans Flex", sans-serif; font-weight: 600; font-size: 24px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .item .sub { font: 400 11px/1.4 var(--font-body); letter-spacing: -0.01em; opacity: 0.7; }
  .ok   { background: #E6F1EA; border-color: #C7E0CF; color: #1F5C3C; }
  .warn { background: #F8EFD9; border-color: #E8D7A7; color: #7A5210; }
  .err  { background: #F8E1DE; border-color: #ECC0B9; color: #7A1F18; }
  .ok .dot { background: #2F8F5C; }
  .warn .dot { background: #C58B2A; }
  .err .dot { background: #C73428; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .name { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 14px; }
</style></head>
<body>
<div class="card">
  <div class="label">Semantic · 04</div>
  <div class="name">Status — sparingly applied</div>
  <div class="row">
    <div class="item ok">
      <div class="meta"><span class="dot"></span> Completed</div>
      <div class="num">+ $1,205</div>
      <div class="sub">Green · 500 / 50</div>
    </div>
    <div class="item warn">
      <div class="meta"><span class="dot"></span> Pending</div>
      <div class="num">$ 432</div>
      <div class="sub">Amber · 500 / 50</div>
    </div>
    <div class="item err">
      <div class="meta"><span class="dot"></span> Failed</div>
      <div class="num">− $ 89</div>
      <div class="sub">Red · 500 / 50</div>
    </div>
  </div>
</div>
</body></html>
