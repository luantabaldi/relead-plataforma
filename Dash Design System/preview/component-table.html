<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label-card { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font: 400 12px/1 var(--font-mono); letter-spacing: -0.02em; }
  th { font: 700 10px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--paper-200); }
  td { padding: 14px 8px; border-bottom: 1px solid var(--paper-200); color: var(--ink-200); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: var(--paper-50); }
  .num { font-family: "Google Sans Flex Display", "Google Sans Flex", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-300); letter-spacing: -0.02em; }
  .activity { display: flex; align-items: center; gap: 10px; }
  .ic { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font: 700 11px/1 var(--font-mono); }
  .ic.a { background: #D6D9E7; color: #121839; }
  .ic.b { background: #E6F1EA; color: #1F5C3C; }
  .ic.c { background: #EDE6D8; color: #4D463C; }
  .chip { font: 700 10px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; }
  .ok { background: #E6F1EA; color: #1F5C3C; } .ok .dot { background: #2F8F5C; }
  .warn { background: #F8EFD9; color: #7A5210; } .warn .dot { background: #C58B2A; }
  .checkbox { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--paper-300); display: inline-block; vertical-align: middle; }
  .checkbox.on { background: var(--ink-300); border-color: var(--ink-300); position: relative; }
  .checkbox.on::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px; border: solid var(--paper-50); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
</style></head>
<body>
<div class="card">
  <div class="label-card">Components · 13</div>
  <div class="title">Data table rows</div>
  <table>
    <thead><tr>
      <th style="width:24px;"></th>
      <th>Order ID</th>
      <th>Activity</th>
      <th>Price</th>
      <th>Status</th>
      <th>Date</th>
    </tr></thead>
    <tbody>
      <tr><td><span class="checkbox"></span></td><td class="num">INV_000076</td><td><div class="activity"><span class="ic a">M</span>Mobile app purchase</div></td><td class="num">$25,500</td><td><span class="chip ok"><span class="dot"></span>Completed</span></td><td>17 Apr · 03:45 PM</td></tr>
      <tr><td><span class="checkbox"></span></td><td class="num">INV_000075</td><td><div class="activity"><span class="ic b">H</span>Hotel booking</div></td><td class="num">$32,750</td><td><span class="chip warn"><span class="dot"></span>Pending</span></td><td>15 Apr · 11:30 AM</td></tr>
      <tr><td><span class="checkbox on"></span></td><td class="num">INV_000073</td><td><div class="activity"><span class="ic c">G</span>Grocery purchase</div></td><td class="num">$50,200</td><td><span class="chip ok"><span class="dot"></span>Completed</span></td><td>14 Apr · 09:15 PM</td></tr>
    </tbody>
  </table>
</div>
</body></html>
