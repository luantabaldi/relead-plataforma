<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label-card { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .title { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 28px; }
  .mark-lg { width: 96px; height: 96px; border-radius: 22px; background: var(--orange-600); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(23, 30, 69, 0.22); }
  .mark-lg svg { display: block; }
  .lockup { font: 500 64px/0.95 var(--font-display); color: var(--ink-300); letter-spacing: -0.04em; display: flex; align-items: center; gap: 18px; }
  .lockup-mark { width: 56px; height: 56px; border-radius: 13px; background: var(--orange-600); display: inline-flex; align-items: center; justify-content: center; }
  .mark-sm-wrap { display: flex; gap: 14px; align-items: flex-end; margin-top: 18px; }
  .mark-sm-wrap > div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mark-sm-wrap .label { font: 400 10px/1 var(--font-mono); color: var(--ink-50); letter-spacing: -0.02em; }
  .mini-mark { background: var(--orange-600); display: inline-flex; align-items: center; justify-content: center; }
  .m1 { width: 32px; height: 32px; border-radius: 8px; }
  .m2 { width: 24px; height: 24px; border-radius: 6px; }
  .m3 { width: 16px; height: 16px; border-radius: 4px; }
</style></head>
<body>
<div class="card">
  <div class="label-card">Brand · 15</div>
  <div class="title">Logo & mark</div>
  <div class="row">
    <div class="mark-lg">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none"><path d="M40 16 L24 48" stroke="#FBF8F3" stroke-width="6" stroke-linecap="round"/></svg>
    </div>
    <div class="lockup">
      <span class="lockup-mark">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><path d="M40 16 L24 48" stroke="#FBF8F3" stroke-width="6" stroke-linecap="round"/></svg>
      </span>
      Dash
    </div>
  </div>
  <div class="mark-sm-wrap">
    <div>
      <span class="mini-mark m1"><svg width="18" height="18" viewBox="0 0 64 64"><path d="M40 16 L24 48" stroke="#FBF8F3" stroke-width="8" stroke-linecap="round"/></svg></span>
      <span class="label">32px</span>
    </div>
    <div>
      <span class="mini-mark m2"><svg width="14" height="14" viewBox="0 0 64 64"><path d="M40 16 L24 48" stroke="#FBF8F3" stroke-width="8" stroke-linecap="round"/></svg></span>
      <span class="label">24px</span>
    </div>
    <div>
      <span class="mini-mark m3"><svg width="10" height="10" viewBox="0 0 64 64"><path d="M40 16 L24 48" stroke="#FBF8F3" stroke-width="10" stroke-linecap="round"/></svg></span>
      <span class="label">16px favicon</span>
    </div>
  </div>
</div>
</body></html>
