<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1 / 1.1; border-radius: 12px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: -0.02em; }
  .sw .n { font-weight: 700; font-size: 12px; }
  .sw .h { opacity: 0.7; font-size: 10px; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .name { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 14px; }
</style></head>
<body>
<div class="card">
  <div class="label">Brand · 01</div>
  <div class="name">Orange — Ember & Flare</div>
  <div class="ramp">
    <div class="sw" style="background:#FFF3EC; color:#842808;"><div class="n">50</div><div class="h">FFF3EC</div></div>
    <div class="sw" style="background:#FFE2D1; color:#842808;"><div class="n">100</div><div class="h">FFE2D1</div></div>
    <div class="sw" style="background:#FFC4A1; color:#4F1804;"><div class="n">200</div><div class="h">FFC4A1</div></div>
    <div class="sw" style="background:#FFA070; color:#4F1804;"><div class="n">300</div><div class="h">FFA070</div></div>
    <div class="sw" style="background:#FF7A42; color:#4F1804;"><div class="n">400</div><div class="h">FF7A42</div></div>
    <div class="sw" style="background:#F45A1F; color:#FFF3EC;"><div class="n">500</div><div class="h">F45A1F</div></div>
    <div class="sw" style="background:#E0481A; color:#FFF3EC; outline: 2px solid var(--ink-300); outline-offset: -2px;"><div class="n">600 ★</div><div class="h">E0481A</div></div>
    <div class="sw" style="background:#B43712; color:#FFF3EC;"><div class="n">700</div><div class="h">B43712</div></div>
    <div class="sw" style="background:#842808; color:#FFE2D1;"><div class="n">800</div><div class="h">842808</div></div>
  </div>
  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-50); letter-spacing: -0.02em; margin-top: 14px;">★ 600 = primary CTA "Ember" · 500 = chart fill "Flare"</div>
</div>
</body></html>
