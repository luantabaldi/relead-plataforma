<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1 / 1.1; border-radius: 12px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: -0.02em; color: #FBF8F3; }
  .sw .n { font-weight: 700; font-size: 12px; }
  .sw .h { opacity: 0.7; font-size: 10px; }
  .label { font: 700 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-50); margin-bottom: 10px; }
  .name { font: 500 22px/1 var(--font-display); color: var(--ink-300); letter-spacing: -0.01em; margin-bottom: 14px; }
</style></head>
<body>
<div class="card">
  <div class="label">Text · 03</div>
  <div class="name">Ink — warm-black, never pure</div>
  <div class="ramp">
    <div class="sw" style="background:#6E665A;"><div class="n">50</div><div class="h">6E665A</div></div>
    <div class="sw" style="background:#4D463C;"><div class="n">100</div><div class="h">4D463C</div></div>
    <div class="sw" style="background:#2E2A23;"><div class="n">200 ★</div><div class="h">2E2A23</div></div>
    <div class="sw" style="background:#1A1611;"><div class="n">300</div><div class="h">1A1611</div></div>
    <div class="sw" style="background:#0E0C09;"><div class="n">400</div><div class="h">0E0C09</div></div>
  </div>
  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-50); letter-spacing: -0.02em; margin-top: 14px;">★ 200 is body text · 300 is headlines · 400 reserved for dark surfaces</div>
</div>
</body></html>
